<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Completely disable pinch and double-tap zooming on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FEBTECH QR Code Generator</title>
    
    <!-- External Database Files -->
    <script src="qr_database.js"></script>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Top Buttons Shared Styles */
        .top-btn {
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 100;
            transition: 0.2s;
        }
        .top-btn:hover { filter: brightness(1.1); }
        .top-btn:active { transform: scale(0.95); }

        /* Group left buttons to prevent overlap */
        .top-left-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        #recentBtn { background: #5856d6; }
        #searchBtn { background: #34c759; }
        
        #tokensBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff9500; 
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        /* Dark container for Search Modal */
        .dark-container {
            background: rgba(40, 40, 40, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            max-width: 480px;
        }
        .dark-container h2 {
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }
        .dark-container input {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .dark-container input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        .dark-container input::placeholder { color: #ccc; }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #111;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            background: white;
            transition: .2s;
        }

        input:focus {
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0,122,255,.15);
        }

        input[list] { cursor: text; }

        /* Shared box style for Model and Serial */
        .model-box, .serial-box {
            display: flex;
            align-items: center;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            height: 50px;
            transition: .2s;
        }

        .model-box:focus-within, .serial-box:focus-within {
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0,122,255,.15);
        }

        .prefix {
            background: #f5f5f7;
            color: #555;
            padding: 0 15px;
            height: 50px;
            display: flex;
            align-items: center;
            font-weight: bold;
            border-right: 1px solid #d1d1d6;
            white-space: nowrap;
        }

        .model-box input, .serial-box input {
            border: none;
            border-radius: 0;
            height: 100%;
            box-shadow: none;
        }
        
        .model-box input:focus, .serial-box input:focus {
            box-shadow: none;
        }

        .model-box input {
            flex: 1;
            padding-left: 15px;
        }

        /* Specific styles for the multipart Serial Box */
        .serial-box input {
            text-align: center;
            padding: 0 5px;
        }
        .serial-box .dash {
            color: #888;
            font-weight: bold;
            user-select: none;
        }
        #serial-prefix { 
            width: 25%; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        #serial-year, #serial-month {
            background: #f5f5f7;
            color: #555;
            font-weight: 500;
        }
        #serial-year { width: 22%; }
        #serial-month { width: 15%; }
        #serial-seq { flex: 1; text-align: left; padding-left: 10px; }

        button.generate-btn {
            width: 100%;
            height: 52px;
            margin-top: 28px;
            border: none;
            border-radius: 12px;
            background: #007AFF;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        button.generate-btn:hover { background: #0063d1; }
        button.generate-btn:active { transform: scale(.98); }

        /* Full Screen Modal Styling */
        .modal {
            display: none; 
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 15px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 45px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            z-index: 1010;
        }

        /* QR Code Modal Specifics */
        #qrcode img, #qrcode canvas {
            border: 15px solid white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90vw;
            max-height: 90vw;
        }
        
        .qr-hint {
            color: white;
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        .qr-details {
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
        }

        .qr-details strong {
            color: white;
            font-weight: 600;
        }

        /* Recent QR Modal Specifics */
        .recent-modal-header {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
            text-align: center;
        }
        .recent-modal-subtitle {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }
        .recent-list {
            width: 100%;
            max-width: 450px;
            max-height: 70vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }
        .recent-card {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .recent-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .recent-card:active { transform: scale(0.98); }
        .recent-card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }
        .recent-card-info {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
        }
        .recent-card-time {
            font-size: 11px;
            color: #ffa500;
            margin-top: 6px;
            font-weight: 500;
        }
        .recent-empty {
            color: #ccc;
            font-size: 15px;
            text-align: center;
            margin-top: 40px;
        }

        /* Tokens Slider Specifics */
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 75vh;
        }

        #tokenImg {
            width: 100vw;
            max-height: 75vh; 
            border-radius: 12px;
            object-fit: contain; 
            transition: opacity 0.3s ease;
            touch-action: none;
        }

        .token-title {
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .token-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .nav-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            font-size: 20px;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .nav-btn:active { background: rgba(255,255,255,0.5); }
        
        .token-counter {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }

        @media(max-width: 500px) {
            .container { padding: 20px; border-radius: 16px; }
            h1 { font-size: 24px; }
            .close-btn { top: 20px; right: 20px; font-size: 40px; }
            
            /* Responsive Top Buttons */
            .top-left-controls { left: 10px; gap: 6px; }
            .top-btn { padding: 6px 10px; font-size: 12px; }
            #tokensBtn { right: 10px; }

            #serial-prefix { width: 28%; font-size: 14px;}
            #serial-year { width: 22%; font-size: 14px;}
            #serial-month { width: 16%; font-size: 14px;}
            #serial-seq { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Top Left Buttons -->
    <div class="top-left-controls">
        <button id="recentBtn" class="top-btn" onclick="openRecentModal()">Recent QR</button>
        <button id="searchBtn" class="top-btn" onclick="openSearchModal()">Search Machine</button>
    </div>

    <!-- Top Right Tokens Button -->
    <button id="tokensBtn" class="top-btn" onclick="openTokensModal()">Tokens</button>

    <!-- Main Generator Container -->
    <div class="container">
        <h1>FEBTECH QR Code Generator</h1>

        <!-- Machine -->
        <label>Machine Name</label>
        <input list="machines" id="machine" placeholder="Start typing machine name..." autocomplete="off">
        <datalist id="machines"></datalist>

        <!-- Model -->
        <label>Model Number</label>
        <div class="model-box">
            <span class="prefix">FEBTECH-</span>
            <input list="models" type="text" id="model" placeholder="0480A CL" autocomplete="off">
            <datalist id="models"></datalist>
        </div>

        <!-- Serial (Multipart Format) -->
        <label>Serial Number</label>
        <div class="serial-box">
            <input list="prefixes" type="text" id="serial-prefix" placeholder="Initials" autocomplete="off" title="Machine Initials (Editable)">
            <datalist id="prefixes"></datalist>
            
            <span class="dash">-</span>
            <input type="text" id="serial-year" placeholder="YYYY" maxlength="4" autocomplete="off" title="Year (Editable)">
            <span class="dash">-</span>
            <input type="text" id="serial-month" placeholder="MM" maxlength="2" autocomplete="off" title="Month (Editable)">
            <span class="dash">-</span>
            <input list="serials" type="text" id="serial-seq" placeholder="Seq #" autocomplete="off" title="Sequence Number">
            <datalist id="serials"></datalist>
        </div>

        <!-- Responsible Person -->
        <label>Responsible Person</label>
        <input list="persons" id="person" placeholder="Select or type a name..." autocomplete="off">
        <datalist id="persons">
            <option value="Mr. Amrut Deshmukh">
            <option value="Mr. Rajaram Mithe">
            <option value="Mr. Umesh Kale">
        </datalist>

        <!-- Button -->
        <button class="generate-btn" onclick="generateQR()">Generate QR Code</button>
    </div>

    <!-- QR Code Modal (Full Screen) -->
    <div id="qrModal" class="modal">
        <span class="close-btn" onclick="closeQRModal()">&times;</span>
        <div id="qrcode"></div>
        <div class="qr-hint">Scan from screen</div>
        <div id="qrDetails" class="qr-details"></div>
    </div>

    <!-- Recent QRs Modal (Full Screen) -->
    <div id="recentModal" class="modal">
        <span class="close-btn" onclick="closeRecentModal()">&times;</span>
        <div class="recent-modal-header">Recent QR Codes</div>
        <div class="recent-modal-subtitle">Synced across all devices • Auto-deletes after 48 hours</div>
        
        <div id="recentList" class="recent-list"></div>
    </div>

    <!-- Search Machine Modal -->
    <div id="searchModal" class="modal">
        <span class="close-btn" onclick="closeSearchModal()">&times;</span>
        <div class="container dark-container">
            <h2>Search Database</h2>
            
            <label style="color: #ddd; margin-top: 0;">Search Text</label>
            <input type="text" id="searchInput" placeholder="Machine, Model, Serial, Client..." onkeypress="if(event.key==='Enter') searchMachine()" style="margin-bottom: 10px;">
            
            <!-- Collapsible Date Filter to save space -->
            <details style="margin-bottom: 15px; cursor: pointer;">
                <summary style="color: #34c759; font-weight: bold; outline: none;">+ Add Date Filter</summary>
                <div style="display: flex; gap: 15px; margin-top: 10px;">
                    <div style="flex: 1;">
                        <label style="color: #ddd; margin-top: 0; font-size: 13px;">From Date</label>
                        <input type="date" id="searchFromDate" style="padding: 0 10px; height: 40px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="color: #ddd; margin-top: 0; font-size: 13px;">To Date</label>
                        <input type="date" id="searchToDate" style="padding: 0 10px; height: 40px;">
                    </div>
                </div>
            </details>

            <button class="generate-btn" onclick="searchMachine()" style="background: #34c759; margin-top: 10px;">Search</button>
            <div id="searchResults" style="margin-top: 20px; max-height: 40vh; overflow-y: auto; padding-right: 5px;"></div>
        </div>
    </div>

    <!-- Tokens Gallery Modal (Full Screen) -->
    <div id="tokensModal" class="modal">
        <span class="close-btn" onclick="closeTokensModal()">&times;</span>
        
        <div class="token-title" id="tokenTitle">Main Title</div>
        
        <div class="slider-container">
            <img id="tokenImg" src="" alt="Token Image">
        </div>
        
        <div class="token-footer">
            <button class="nav-btn left" onclick="prevToken()">&#10094;</button>
            <div class="token-counter" id="tokenCounter">1 / 6</div>
            <button class="nav-btn right" onclick="nextToken()">&#10095;</button>
        </div>
    </div>

    <script>
        // =========================
        // Default Machine List
        // =========================
        const DEFAULT_MACHINES = [
            "Febtech's DCM-180", "Febtech's DCM-300", "Automatic Ladling Machine",
            "Servo Sprayer Two Axis", "Linear Servo Sprayer Two Axis", "Auto Spray",
            "Servo Sprayer With Extractor Four Axis", "Centralized Die-cote Mixing Unit",
            "Vertical Auto Sprayer", "Die Coat Container with Mixing Unit",
            "Mould Channel Descaling Unit", "Portable Die Coat Mixing Unit",
            "Quenching Tank", "Automatic Extractor", "Jet Cooling Unit (Open Loop)",
            "Cooling Conveyor", "Auto Die Clamping Unit", "Jet Cooling Unit (Closed Loop)",
            "Mould Temperature Controller", "Mould Vacuum Unit", "N2 Degassing Machine",
            "Hoistable Degassing Unit", "Vacuum Testing Unit", "Density Index Analyzer",
            "Dispenser Unit", "Plunger Lubrication Unit", "Ejector Pin Cutting Machine",
            "Metal Transfer Ladle", "Universal Precision Grinder"
        ];

        // =========================
        // Fetch Google Sheets Data
        // =========================
        const API_URL = "https://script.google.com/macros/s/AKfycbxHsrs7C2PKLUhwO9oILKx4fczyGdzPa3q0mxzIEVRN6zHQrC_eeDMwRuERlWGBROVa_g/exec";
        
        let liveSheetData = [];   
        let cloudRecentQRs = [];  
        let fetchPromise = null; 

        // iOS Text Sanitizer: Fixes iPhone "Smart Punctuation" (curly quotes)
        function sanitizeIOS(text) {
            return String(text || "").replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').trim();
        }

        async function fetchGoogleSheetData() {
            if (fetchPromise) return fetchPromise; 
            
            fetchPromise = (async () => {
                try {
                    const urlWithCacheBuster = API_URL + "?t=" + new Date().getTime();
                    const response = await fetch(urlWithCacheBuster, { 
                        method: 'GET',
                        redirect: "follow" 
                    });
                    
                    if (!response.ok) throw new Error("Network response was not ok");
                    
                    const data = await response.json();
                    
                    liveSheetData = data.machines || [];
                    cloudRecentQRs = (data.recentQRs || []).sort((a, b) => b.timestamp - a.timestamp);
                    
                    updateSuggestions(); 
                    
                    // If modal is open on iPhone, redraw instantly
                    if (document.getElementById("recentModal").style.display === "flex") {
                        renderRecentList();
                    }
                } catch (error) {
                    console.error("Error fetching data:", error);
                    // On iOS, silently fail but allow the app to keep working with defaults
                } finally {
                    fetchPromise = null; 
                }
            })();
            
            return fetchPromise;
        }

        function updateDatalistDOM(id, dataSet) {
            const datalist = document.getElementById(id);
            datalist.innerHTML = ""; 
            const fragment = document.createDocumentFragment();
            dataSet.forEach(val => {
                let opt = document.createElement("option");
                opt.value = val;
                fragment.appendChild(opt);
            });
            datalist.appendChild(fragment);
        }

        // =========================
        // Handle Auto Suggestions & Serial Prefix Logic
        // =========================
        function updateSuggestions() {
            const machineInputRaw = document.getElementById("machine").value;
            // Clean iPhone smart quotes from user input
            const machineInput = sanitizeIOS(machineInputRaw).toLowerCase();

            let availableMachines = new Set(DEFAULT_MACHINES);
            let availableModels = new Set();
            let availableSerials = new Set();
            let availablePrefixes = new Set(); 
            
            let machineExistsInDB = false;

            liveSheetData.forEach(item => {
                // Clean iPhone smart quotes from database data
                const dbMachineRaw = sanitizeIOS(item.machine);
                const dbMachineLower = dbMachineRaw.toLowerCase();
                const dbModel = sanitizeIOS(item.model);
                const dbSerial = sanitizeIOS(item.serial);

                if (dbMachineRaw !== "") {
                    availableMachines.add(dbMachineRaw);
                }

                if (machineInput !== "") {
                    // This comparison now perfectly matches iOS input to PC Database
                    if (dbMachineLower === machineInput) {
                        machineExistsInDB = true;
                        
                        if (dbModel) {
                            let cleanModel = dbModel.startsWith("FEBTECH-") ? dbModel.replace("FEBTECH-", "") : dbModel;
                            availableModels.add(cleanModel);
                        }
                        
                        if (dbSerial.includes("-")) {
                            const parts = dbSerial.split('-');
                            availablePrefixes.add(parts[0]);
                            availableSerials.add(parts[parts.length - 1]); 
                        }
                    }
                } else {
                    if (dbModel) {
                        let cleanModel = dbModel.startsWith("FEBTECH-") ? dbModel.replace("FEBTECH-", "") : dbModel;
                        availableModels.add(cleanModel);
                    }
                }
            });

            updateDatalistDOM("machines", availableMachines);
            updateDatalistDOM("models", availableModels);
            updateDatalistDOM("prefixes", availablePrefixes);
            updateDatalistDOM("serials", availableSerials);

            const prefixInput = document.getElementById("serial-prefix");
            
            if (machineExistsInDB) {
                if (availablePrefixes.size === 1) {
                    if (!availablePrefixes.has(prefixInput.value.toUpperCase())) {
                        prefixInput.value = Array.from(availablePrefixes)[0];
                    }
                } else if (availablePrefixes.size > 1) {
                    if (!availablePrefixes.has(prefixInput.value.toUpperCase())) {
                        prefixInput.value = "";
                        prefixInput.placeholder = "Select Initial...";
                    }
                }
            } else if (machineInputRaw.trim() === "") {
                prefixInput.value = "";
                prefixInput.placeholder = "Initials";
            }
        }

        const machineElement = document.getElementById("machine");
        // Added 'keyup' to catch mobile keyboard events more aggressively
        machineElement.addEventListener("input", updateSuggestions);
        machineElement.addEventListener("keyup", updateSuggestions);
        machineElement.addEventListener("change", updateSuggestions);
        machineElement.addEventListener("blur", updateSuggestions);

        document.getElementById("serial-prefix").addEventListener("input", function() {
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.toUpperCase();
            this.setSelectionRange(start, end);
        });

        // =========================
        // Centralized Recent QR Logic
        // =========================
        function renderRecentList() {
            const recentList = document.getElementById("recentList");
            recentList.innerHTML = "";
            
            if (cloudRecentQRs.length === 0) {
                recentList.innerHTML = `<div class="recent-empty">No recent QR codes found in the cloud.<br>Any QR older than 48 hours is automatically excluded.</div>`;
                return;
            }

            cloudRecentQRs.forEach(item => {
                const hoursAgo = Math.floor((Date.now() - item.timestamp) / (1000 * 60 * 60));
                const minsAgo = Math.floor(((Date.now() - item.timestamp) % (1000 * 60 * 60)) / (1000 * 60));
                const timeText = hoursAgo > 0 ? `${hoursAgo}h ${minsAgo}m ago` : `${minsAgo}m ago`;
                const hoursRemaining = Math.max(0, 48 - hoursAgo);

                const card = document.createElement("div");
                card.className = "recent-card";
                card.innerHTML = `
                    <div class="recent-card-title">${item.machine}</div>
                    <div class="recent-card-info">
                        <strong>Model:</strong> ${item.model} | <strong>Serial:</strong> ${item.serial}<br>
                        <strong>Date:</strong> ${item.date} | <strong>By:</strong> ${item.person}
                    </div>
                    <div class="recent-card-time">Generated ${timeText} • Expires in ${hoursRemaining}h</div>
                `;
                card.onclick = () => previewRecentQR(item);
                recentList.appendChild(card);
            });
        }

        function openRecentModal() {
            document.getElementById("recentModal").style.display = "flex";
            
            if (cloudRecentQRs.length === 0 && fetchPromise) {
                document.getElementById("recentList").innerHTML = `<div class="recent-empty">Syncing with cloud...</div>`;
            } else {
                renderRecentList();
            }

            fetchGoogleSheetData(); 
        }

        function closeRecentModal() {
            document.getElementById("recentModal").style.display = "none";
        }

        function previewRecentQR(item) {
            closeRecentModal();
            renderQRModal(item.machine, item.model, item.serial, item.date, item.person, item.qrText);
        }

        // =========================
        // Search Machine Database
        // =========================
        function openSearchModal() {
            document.getElementById('searchModal').style.display = 'flex';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchFromDate').value = '';
            document.getElementById('searchToDate').value = '';
            document.getElementById('searchInput').focus();
        }

        function closeSearchModal() {
            document.getElementById('searchModal').style.display = 'none';
        }

        function searchMachine() {
            const query = sanitizeIOS(document.getElementById('searchInput').value).toLowerCase();
            const fromDateVal = document.getElementById('searchFromDate').value;
            const toDateVal = document.getElementById('searchToDate').value;
            const resultsDiv = document.getElementById('searchResults');
            
            if (!query && !fromDateVal && !toDateVal) {
                resultsDiv.innerHTML = '<div style="text-align:center;">Please enter a search term or select a date filter.</div>';
                return;
            }

            const fromDate = fromDateVal ? new Date(fromDateVal) : null;
            if (fromDate) fromDate.setHours(0, 0, 0, 0);

            const toDate = toDateVal ? new Date(toDateVal) : null;
            if (toDate) toDate.setHours(23, 59, 59, 999);

            const results = liveSheetData.filter(item => {
                let textMatch = true;
                if (query) {
                    textMatch = (sanitizeIOS(item.machine).toLowerCase().includes(query)) ||
                                (sanitizeIOS(item.model).toLowerCase().includes(query)) ||
                                (sanitizeIOS(item.serial).toLowerCase().includes(query)) ||
                                (sanitizeIOS(item.client).toLowerCase().includes(query));
                }

                let dateMatch = true;
                if (fromDate || toDate) {
                    if (!item.dateAdded) {
                        dateMatch = false; 
                    } else {
                        let dateStr = String(item.dateAdded || "");
                        let itemDate = new Date(dateStr);
                        
                        if (isNaN(itemDate.getTime())) {
                            const parts = dateStr.split('/');
                            if(parts.length === 2) itemDate = new Date(parts[1], parts[0] - 1, 1);
                        }

                        if (!isNaN(itemDate.getTime())) {
                            if (fromDate && itemDate < fromDate) dateMatch = false;
                            if (toDate && itemDate > toDate) dateMatch = false;
                        } else {
                            dateMatch = false;
                        }
                    }
                }
                return textMatch && dateMatch;
            });

            if (results.length > 0) {
                let html = `<div style="margin-bottom:15px; font-weight:bold; color:#34c759;">Found ${results.length} matching machine(s):</div>`;
                results.forEach(res => {
                    html += `
                    <div style="background: rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; line-height: 1.5;">
                        <strong>Machine:</strong> ${res.machine}<br>
                        <strong>Model:</strong> ${res.model}<br>
                        <strong>Serial:</strong> ${res.serial}<br>
                        <strong>Client:</strong> ${res.client || 'N/A'}<br>
                        <strong>Date Added:</strong> ${res.dateAdded || 'N/A'}<br>
                        <strong>By:</strong> ${res.responsible || 'N/A'}
                    </div>`;
                });
                resultsDiv.innerHTML = html;
            } else {
                resultsDiv.innerHTML = '<div style="text-align:center; color: #ff453a; font-weight: 600;">❌ No machines found matching your criteria.</div>';
            }
        }

        // =========================
        // Load Saved Persons
        // =========================
        const personList = document.getElementById("persons");
        let savedPersons = JSON.parse(localStorage.getItem("persons")) || [];
        savedPersons.forEach(name => {
            const option = document.createElement("option");
            option.value = name;
            personList.appendChild(option);
        });

        // Initialize Default Serial Dates on load
        function initSerialDates() {
            const now = new Date();
            document.getElementById("serial-year").value = now.getFullYear();
            document.getElementById("serial-month").value = String(now.getMonth() + 1).padStart(2, '0');
        }

        // =========================
        // Generate & Render QR Code
        // =========================
        function renderQRModal(machine, model, serial, date, person, qrText) {
            const qr = document.getElementById("qrcode");
            qr.innerHTML = "";
            new QRCode(qr, {
                text: qrText,
                width: 280, 
                height: 280,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            const qrDetails = document.getElementById("qrDetails");
            qrDetails.innerHTML = `
                <div><strong>Machine:</strong> ${machine}</div>
                <div><strong>Model:</strong> ${model}</div>
                <div><strong>Serial Number:</strong> ${serial}</div>
                <div><strong>Date:</strong> ${date}</div>
                <div><strong>Responsible:</strong> ${person}</div>
            `;
            openQRModal();
        }

        async function generateQR() {
            const machine = sanitizeIOS(document.getElementById("machine").value);
            const modelInput = sanitizeIOS(document.getElementById("model").value);
            const person = sanitizeIOS(document.getElementById("person").value);

            const pfx = sanitizeIOS(document.getElementById("serial-prefix").value);
            const yr = sanitizeIOS(document.getElementById("serial-year").value);
            const mo = sanitizeIOS(document.getElementById("serial-month").value);
            const seq = sanitizeIOS(document.getElementById("serial-seq").value);

            if (machine == "") return alert("Select Machine Name");
            if (modelInput == "") return alert("Enter Model Number");
            if (!pfx || !yr || !mo || !seq) return alert("Please fill all parts of the Serial Number");
            
            if (!/^\d{4}$/.test(yr)) return alert("Year must be a 4-digit number (YYYY)");
            if (!/^\d{2}$/.test(mo)) return alert("Month must be a 2-digit number (MM)");
            if (person == "") return alert("Enter Responsible Person");

            const serial = `${pfx}-${yr}-${mo}-${seq}`;
            const date = `${mo}/${yr}`; 

            const serialExists = liveSheetData.some(item => sanitizeIOS(item.serial) === serial);
            if (serialExists) {
                const proceed = confirm("⚠️ This Serial Number is already available in the Database.\n\nDo you still want to continue and generate the QR code to add more images/records?");
                if (!proceed) return; 
            }

            if (!savedPersons.includes(person) && person != "Mr. Amrut Deshmukh" && person != "Mr. Rajaram Mithe" && person != "Mr. Umesh Kale") {
                savedPersons.push(person);
                localStorage.setItem("persons", JSON.stringify(savedPersons));
                const option = document.createElement("option");
                option.value = person;
                personList.appendChild(option);
            }

            const model = "FEBTECH-" + modelInput;
            const qrText = `##########-THIS_NEW_START-##########\n${machine}\n${model}\n${serial}\n${date}\n${person}`;

            renderQRModal(machine, model, serial, date, person, qrText);

            const payload = {
                timestamp: Date.now(),
                machine: machine,
                model: model,
                serial: serial,
                date: date, 
                person: person,
                qrText: qrText
            };

            cloudRecentQRs.unshift(payload);

            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("Error saving QR Code to cloud.", e);
            }
        }

        function openQRModal() { document.getElementById('qrModal').style.display = 'flex'; }
        function closeQRModal() { document.getElementById('qrModal').style.display = 'none'; }

        // =========================
        // Tokens Slider Logic
        // =========================
        const tokens = [
            { src: "tokens_qr_codes_MACHINE ID RECORD.webp", title: "MACHINE ID RECORD" },
            { src: "tokens_qr_codes_ADDITIONAL VIEW.webp", title: "ADDITIONAL VIEW" },
            { src: "tokens_qr_codes_ELECTRICAL PANEL.webp", title: "ELECTRICAL PANEL" },
            { src: "tokens_qr_codes_MAIN VISUAL RECORD.webp", title: "MAIN VISUAL RECORD" },
            { src: "tokens_qr_codes_MACHINE SPARES.webp", title: "SPARE" },
            { src: "tokens_qr_codes_DAMAGE & ISSUE.webp", title: "DAMAGE & ISSUE" }
        ];
        
        let currentTokenIndex = 0;
        const tokenImgElement = document.getElementById("tokenImg");
        const tokenTitleElement = document.getElementById("tokenTitle");
        const tokenCounterElement = document.getElementById("tokenCounter");

        function openTokensModal() {
            document.getElementById('tokensModal').style.display = 'flex';
            updateTokenView();
        }

        function closeTokensModal() {
            document.getElementById('tokensModal').style.display = 'none';
        }

        function updateTokenView() {
            tokenImgElement.style.opacity = 0;
            setTimeout(() => {
                tokenImgElement.src = tokens[currentTokenIndex].src;
                tokenTitleElement.innerText = tokens[currentTokenIndex].title;
                tokenCounterElement.innerText = `${currentTokenIndex + 1} / ${tokens.length}`;
                tokenImgElement.style.opacity = 1;
            }, 150);
        }

        function nextToken() {
            currentTokenIndex = (currentTokenIndex + 1) % tokens.length;
            updateTokenView();
        }

        function prevToken() {
            currentTokenIndex = (currentTokenIndex - 1 + tokens.length) % tokens.length;
            updateTokenView();
        }

        let touchStartX = 0;
        let touchEndX = 0;
        tokenImgElement.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        tokenImgElement.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); });

        function handleSwipe() {
            if (touchEndX < touchStartX - 40) nextToken();
            if (touchEndX > touchStartX + 40) prevToken();
        }

        // =========================
        // ENTER & ESCAPE KEYS
        // =========================
        document.addEventListener("keydown", function(e) {
            const searchModal = document.getElementById('searchModal');
            if (e.key === "Enter") {
                if (searchModal.style.display === 'flex') {
                    searchMachine();
                } else if (document.getElementById('qrModal').style.display !== 'flex' && 
                    document.getElementById('tokensModal').style.display !== 'flex' &&
                    document.getElementById('recentModal').style.display !== 'flex') {
                    generateQR();
                }
            }
            if (e.key === "Escape") {
                closeQRModal();
                closeTokensModal();
                closeRecentModal();
                closeSearchModal();
            }
        });
        
        // Ensure robust initialization on iOS Safari
        function initApp() {
            initSerialDates();      
            updateSuggestions();
            fetchGoogleSheetData(); 
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp(); // Fallback if already loaded
        }
    </script>
</body>
</html>
